# 평가 프로파일 — 골든셋 채점 (04).  PETTRIAGE_PROFILE=eval
#
# 평가는 **재현 가능해야 하므로** 무작위성을 줄인다.

retrieval:
  top_k: 5
  rerank: false

triage:
  # ⚠️ 예전에는 `0` 이었다 — *"되묻기가 섞이면 과소평가율 분모가 흔들린다 (04 §4.1)"*.
  #    2026-08-02 첫 실측에서 **그 근거가 성립하지 않는다**는 것이 드러났다 (D-66).
  #
  #      · 하네스는 이미 **첫 응답만** 채점한다 — 다회차로 번지지 않는다
  #      · `clarify` 도 `refused` 도 `triage` 가 없어 **등급 분모에서 똑같이 빠진다.**
  #        되묻기를 켜든 끄든 `level_n` 은 같다. 흔들릴 것이 없었다
  #      · "전부 되묻기로 도피" 는 `--fail-missed`(등급 미판정) 게이트가 이미 막는다
  #      · 그리고 04 §4.1 은 **그런 말을 한 적이 없다** — 인용이 가리키는 곳이 비어 있었다
  #
  #    끄면 되묻기 기대 15건이 **구조적으로 통과 불가**가 되고,
  #    *"결측을 알아채고 멈췄다"* 는 이 시스템의 핵심 안전 동작이 측정에서 사라진다
  #    (D-10 · D-49 · 02 §6.2). 계약 기본값(`MAX_CLARIFY_TURNS`)과 같은 값으로 둔다.
  max_clarify_turns: 2

serve:
  engine: graph
