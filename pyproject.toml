[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pettriage"
version = "0.1.0"
description = "반려동물 헬스케어 다이어리 & 응급 대응 — RAG + 멀티태스크 sLLM"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "save the pet" }]

# 런타임 최소 집합. 무거운 의존성은 아래 extras 로 분리한다.
# 학습 GPU가 없는 팀원이 `pip install -e .[api]` 만으로 API를 띄울 수 있어야 한다.
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  # `contracts.py` 가 EmailStr 을 쓴다. **핵심 의존성이다.**
  #   contracts.py 는 배달 계층의 단일 계약 출처라 app.main 이 항상 임포트한다 (D-40).
  #   처음에는 [db] extra 에 넣었는데, 그러면 `.[api]` 만 깐 CI test·docker 잡이
  #   `ImportError: email-validator is not installed` 로 죽는다 (2026-08-02 PR#3 CI).
  #   순수 파이썬이고 작아서 핵심에 두는 비용이 거의 없다.
  "email-validator>=2.2,<3",
  # 질의 그래프의 런타임. **핵심 의존성이다** (2026-08-02 랭그래프 도입).
  #   `graph/build.py` 가 `StateGraph` 로 파이프라인을 조립하고
  #   `GraphEngine` 이 그것만 돌린다 — 없으면 엔진이 아예 안 뜬다.
  #   예전에는 [rag] 에 있었다. 그러면 `.[api]` 만 깐 CI test 잡에서
  #   **그래프가 한 줄도 실행되지 않는다** — email-validator 와 같은 사고이고,
  #   D-48 교훈 #6(424줄이 CI에서 한 줄도 안 돌았다)의 재발이다.
  #   둘 다 순수 파이썬이라 핵심에 두는 비용이 작다 (chromadb·torch 를 안 끌고 온다).
  "langgraph>=0.2.62,<0.3",
  "langchain-core>=0.3.59,<0.4",
  # `graph/state.py` 가 직접 임포트한다. pydantic 이 어차피 끌고 오지만,
  # **직접 임포트하는 것은 직접 선언한다** — 남의 의존성에 얹으면 조용히 끊긴다.
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
]
rag = [
  # langgraph·langchain-core 는 **핵심 의존성으로 올라갔다** (위 dependencies 참조).
  # LLM 연동을 LangChain 으로 한다 (D-71 · 필수 산출물).
  # 벡터DB는 chromadb 직접 — 이유는 `client.py::LangChainClient` 머리말.
  # ⚠️ **상한이 아니라 하한이 문제였다.** 처음에 `>=0.3.35` 로 적었다가
  #    설치가 `ResolutionImpossible` 로 죽었다 (2026-08-02) —
  #      0.3.35 → langchain-core>=0.3.78 · openai>=1.104.2
  #    핀은 core 0.3.63 · openai 1.59.6 이라 **연쇄로 넷을 다 올려야** 했다.
  #    0.3.8 은 기존 핀 전부와 그대로 맞는다. 마감 이틀 전에 의존성 넷을 올리는 것보다
  #    한 칸 낮은 버전을 쓰는 쪽이 싸다 — 우리가 쓰는 것은 `ChatOpenAI` 하나다.
  "langchain-openai>=0.3.8,<0.4",
  "langchain-community>=0.3.24,<0.4",
  "sentence-transformers>=3.3,<4",
  "chromadb>=0.6.3,<0.7",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3.6,<0.4",
  "openai>=1.59,<2",
  "anthropic>=0.42,<0.43",
  "langsmith>=0.2.10,<0.3",
]
# 회원가입·로그인·반려동물 프로필 (WS5 백엔드). DB를 쓰는 환경에서만 설치한다.
#
# ⚠ 이 그룹이 없으면 `routes/__init__.py` 가 **기동을 중단시킨다.**
#   예전에는 ImportError 를 잡아 로그만 남겨서, 인증이 통째로 빠진 채
#   앱이 정상 기동했다 (2026-08-01 PR#3 검수에서 발견).
db = [
  "SQLAlchemy>=2.0,<3",
  # MySQL 확정 (D-48). Postgres 드라이버는 [rag] 쪽에만 남는다.
  "PyMySQL>=1.1,<2",
  # passlib 을 쓰지 않는다 — 1.7.4(2020년 마지막 릴리스)가 bcrypt>=4.1 과 깨져
  # **9바이트 비밀번호에서도 ValueError 가 난다.** bcrypt 를 직접 쓴다 (app/auth.py).
  "bcrypt>=4.2,<5",
  "PyJWT>=2.10,<3",
]
# Qwen 을 **로컬에서 서빙**할 때만 (04 비교군 C·D · D-65).
#
# ⚠ `[train]` 과 나누는 이유 — 학습에는 trl·datasets 등이 더 필요하고,
#   추론만 하는 팀원에게 그것까지 깔게 하면 설치가 무거워 **아무도 안 깐다.**
#   그러면 비교군 C·D 는 영원히 미측정으로 남는다.
#   `bitsandbytes` 는 4bit 가중치(unsloth/…-bnb-4bit)를 읽는 데 필수다.
qwen = [
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<0.46",
  "peft>=0.14,<0.15",
]
ingest = [
  "pypdf>=5.1,<6",
  "pdfplumber>=0.11.4,<0.12",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.3,<6",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "Pillow>=11.1,<12",
  "piexif>=1.1.3,<2",
]
# Qwen3-4B QLoRA (D-42). GPU 환경에서만 설치한다.
train = [
  "torch>=2.5,<3",
  # Qwen3 아키텍처 지원은 4.51 부터다. 하한을 내리면 모델 로드가 실패한다 (D-42).
  "transformers>=4.51,<5",
  "peft>=0.14,<0.15",
  "trl>=0.13,<0.14",
  "bitsandbytes>=0.45,<0.46",
  "accelerate>=1.2,<2",
  "datasets>=3.2,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8.6,<0.9",
  "mypy>=1.14,<2",
  "httpx>=0.28,<0.29",
  "pre-commit>=4.0,<5",
  "ipykernel>=6.29,<7",
]

[project.scripts]
# 실행 진입점을 이름으로 고정한다. 팀원이 경로를 외울 필요가 없다.
pettriage-serve = "pettriage.app.main:run"
pettriage-verify = "pettriage.tools.verify_corpus:main"
# DB 스키마 생성. 기동 시 자동 실행하지 않는다 — 명시적 조작이어야 한다.
pettriage-initdb = "pettriage.app.database:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 프론트는 배달 계층의 일부다 — 패키지와 함께 설치되어야 설치본에서도 화면이 뜬다.
pettriage = ["compute/tables/*.csv", "app/web/*"]

# ─────────────────────────────────────────────────────────────
# 도구 설정
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# todo 는 기본 실행에서 뺀다 — 구현 대기 테스트라 CI 를 빨갛게 만들면 안 된다.
addopts = "-q -m 'not todo and not gpu'"
markers = [
  "todo: 구현 대기 — `pytest -m todo` 로 남은 일 목록을 본다",
  "gpu: GPU가 필요한 테스트 (기본 실행에서 제외)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 "함수 호출을 기본 인자에 두지 말 것"은 FastAPI의 Depends/Query 관용구와 충돌한다.
# 라우터 파일에 한정해서만 끈다 — 나머지 코드에서는 그대로 잡힌다.
"src/pettriage/app/routes/*.py" = ["B008"]

# E501 을 이 파일 하나에서만 끈다. 이 스크립트의 **페이로드가 마크다운 원문**이라서다 —
# `CODE_MAP` 등의 문자열 안에 제출용 표가 통째로 들어 있고, 표 행은 접을 수 없다.
# 접는 순간 표가 깨지고, 그러면 린트를 지키려고 산출물을 망가뜨린 것이 된다.
#
# 🔴 대신 **정말로 마크다운만** 길어야 한다. 로직 줄이 길어지는 것을 이 예외가
#    덮게 두면 안 된다 — 마크다운 블록을 별도 `.md` 템플릿으로 빼는 것이 본래 해법이고,
#    이 예외는 그때까지의 임시다 (마감 후 정리 대상).
"scripts/make_submission.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/pettriage"]
omit = ["*/models/training/*"]  # GPU 없이는 실행되지 않는다
