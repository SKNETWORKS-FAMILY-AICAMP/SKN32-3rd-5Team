name: CI

on:
  push:
    #  `[main, develop]` 이었다. **`develop` 은 이 저장소에 존재한 적이 없고**,
    #  실제 작업은 전부 `ohb` · `lgj` 같은 개인 브랜치에서 일어난다.
    #  그래서 푸시 시점에는 게이트가 **한 번도 돌지 않았고**, PR 을 열 때에야
    #  처음 도는 구조였다 — 깨진 채로 며칠이 지나갈 수 있었다.
    #  게이트는 **작업 중에 빨개져야** 쓸모가 있다. 모든 브랜치에서 돈다.
    branches: ["**"]
  pull_request:

#  같은 브랜치를 연달아 푸시하면 앞의 실행을 취소한다.
#  `branches: ["**"]` 로 넓힌 대가(러너 시간)를 여기서 되돌려 받는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      #  버전을 여기 손으로 적지 않는다. `constraints.txt` 가 `ruff==0.8.6` 을 이미 고정한다 —
      #  두 곳에 적으면 한쪽만 올라가고, 그 순간 **로컬과 CI 의 포매터가 갈린다.**
      - run: pip install -c constraints.txt ruff
      #  🔴 검사 경로를 여기 나열하지 않는다. `Makefile` 의 `LINT_PATHS` 가 단일 출처다.
      #
      #  전에는 이 자리에 `ruff check src tests scripts` 라고 **따로 적혀** 있었다.
      #  `Makefile` 은 2026-08-02 에 이미 `eval` 을 넣었는데(하네스 800여 줄이
      #  린트 밖에 있던 것을 발견하고) **CI 사본은 안 고쳐졌다.**
      #  그래서 `make lint` 는 빨간데 CI 는 초록인 상태가 이틀간 유지됐다.
      #
      #  목록이 두 벌이면 언젠가 갈린다. 갈린 쪽이 CI 면 게이트가 거짓말을 한다.
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # 학습 의존성(torch·CUDA)은 설치하지 않는다.
      # models/ 의 무거운 임포트가 함수 안에 있어야 이 job 이 성립한다 —
      # 모듈 최상단으로 올리면 여기서 깨진다. 그것이 의도된 제약이다.
      - run: pip install -e '.[api,dev]' -c constraints.txt
      - name: 안전 장치 회귀 테스트
        #  `pytest -q` 였다. `pyproject.toml` 의 `addopts` 에 **이미 `-q` 가 있어**
        #  실제로는 `-qq` 로 돌았고, 그러면 실패한 테스트의 **이름조차 안 나온다.**
        #  로그만 보고는 무엇이 깨졌는지 알 수 없다.
        #  pytest 의 verbosity 는 합산이다 — `-q`(-1) + `-v`(+1) = 0(기본 출력).
        #  `addopts` 는 손대지 않는다. 로컬에서 조용한 것은 그대로 두는 게 낫다.
        run: pytest -v
      - name: 콘솔 스크립트가 설치 후 실제로 도는가
        # 엔트리포인트는 파일 경로 실행으로는 검증되지 않는다.
        # `scripts/` 처럼 패키지 밖 모듈을 가리키면 여기서 깨진다.
        run: |
          pettriage-verify
          python -c "import pettriage.app.main, pettriage.tools.verify_corpus"
      - name: 층 0 — 코퍼스 검증
        run: pettriage-verify

  db-deps:
    #  test 잡은 '.[api,dev]' 만 깐다. 그래서 auth/pets 는 CI 에서 **임포트조차 되지 않았고**,
    #  passlib·PyJWT·PyMySQL 이 pyproject 에 없다는 사실이 424줄이 들어온 뒤에도 안 잡혔다.
    #  게다가 DATABASE_URL 이 있을 때만 로드되는 구조라 ruff 가 문법만 보고 지나갔다.
    #  이 잡은 **설치가 해결되는가 + 그 코드가 실제로 도는가** 를 본다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[api,db,dev]' -c constraints.txt
      - name: 비밀번호 해싱이 실제로 되는가
        # passlib 1.7.4 는 bcrypt>=4.1 과 깨져 **9바이트 비밀번호에서도** ValueError 를 냈다.
        # 설치가 해결되는 것과 도는 것은 다르다.
        run: |
          python -c "
          from pettriage.app.auth import hash_password, verify_password
          h = hash_password('hunter22!')
          assert h.startswith('\$2') and verify_password('hunter22!', h)
          assert not verify_password('wrong', h)
          print('OK — bcrypt 왕복')
          "
      - name: db 의존성이 깔린 상태의 전체 스위트 (SQLite 인메모리)
        #  `pytest tests/test_auth_api.py` 로 **파일을 지목**하고 있었다.
        #  그래서 `[db]` 가 있어야 도는 테스트를 새로 만들어도
        #  이 목록에 이름을 적기 전까지는 **어느 잡에서도 돌지 않는다** —
        #  `test` 잡은 `[db]` 가 없어 importorskip 으로 통째 건너뛰고,
        #  여기서는 지목되지 않아 건너뛴다. 실제로 `test_records_api.py` 7건이
        #  그 사이에 끼어 있었다 (2026-08-04 발견).
        #
        #  🔴 파일을 지목하지 않는다. **설치 조합이 이 잡의 변수**이고,
        #     그 조합에서 무엇이 도는지는 pytest 가 정하게 둔다.
        run: pytest -v
      - name: DATABASE_URL 이 있는데 의존성이 없으면 기동을 멈추는가
        # 조용히 인증 없는 앱으로 넘어가면 안 된다 (04 §8).
        run: |
          pip uninstall -y PyJWT
          DATABASE_URL="sqlite+pysqlite:///:memory:" python -c "
          import sys
          try:
              from pettriage.app.routes import ALL_ROUTERS
          except Exception as e:
              print(f'OK — 기동 중단: {type(e).__name__}'); sys.exit(0)
          print('::error::의존성이 없는데 앱이 떴다. 인증이 빠진 채 서비스된다')
          sys.exit(1)
          "

  rag-deps:
    #  test 잡은 '.[api,dev]' 만 깐다. 그래서 rag 그룹(langchain·chromadb·
    #  sentence-transformers)의 버전 충돌이 CI 를 통과해 팀원 PC 에서 처음 터졌다.
    #  이 잡은 **설치가 실제로 해결되는지**를 본다 — 테스트는 여기서 돌리지 않는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: rag·ingest 그룹까지 설치가 해결되는가
        run: pip install -e '.[api,rag,ingest,dev]' -c constraints.txt
      - name: 임포트가 실제로 되는가
        run: |
          python -c "import chromadb, langchain_core, langchain_community, langgraph"
          python -c "import sentence_transformers, transformers, numpy, pandas, PIL, piexif"
      - name: 베이스 모델 아키텍처를 transformers 가 아는가 (D-42)
        # Qwen3 지원은 transformers 4.51 부터다. 핀이 내려가면 학습 당일에야 발견된다.
        run: |
          python -c "
          import sys, transformers
          from transformers.models.auto.configuration_auto import CONFIG_MAPPING_NAMES
          if 'qwen3' not in CONFIG_MAPPING_NAMES:
              print(f'::error::transformers {transformers.__version__} 는 Qwen3 를 모른다 (D-42). 4.51 이상 필요')
              sys.exit(1)
          print(f'OK — transformers {transformers.__version__} · Qwen3 지원')
          "
      - name: 학습 그룹도 해결되는가 (설치는 하지 않는다)
        run: pip install --dry-run -e '.[train]' -c constraints.txt

  no-data-committed:
    #  공개 저장소이므로 자료 파일이 커밋되지 않았는지 확인한다 (D-29)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_no_data.sh
      - name: 학습 산출물 차단
        run: |
          set -e
          BAD=$(git ls-files | grep -E '\.(safetensors|bin|gguf|pt|ckpt)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::학습 산출물이 커밋되었다 (D-41):"; echo "$BAD"; exit 1
          fi
          echo "OK — 학습 산출물 없음"

  docker:
    #  이미지가 실제로 빌드되고 뜨는지. 배포 직전에 처음 깨지는 일을 막는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pettriage-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 기동 확인
        run: |
          docker run -d --name api -p 8000:8000 pettriage-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::API가 기동하지 않았다"
          docker logs api
          exit 1
