# 로컬 실행 구성.
#
#   docker compose up db                    MySQL 만 (팀원 PC 에 설치할 필요 없다)
#   docker compose up                       API + MySQL
#   docker compose --profile train run ...  학습 (GPU 필요)
#
# 🔴 data/ 는 마운트만 하고 이미지에 넣지 않는다 (D-29 · .dockerignore).
#
# **벡터DB 는 여기 없다.** D-44 로 Chroma(파일 기반)를 쓰기로 했으므로
# pgvector 컨테이너를 걷어냈다. 여기 있는 DB 는 **계정·프로필 전용**이다.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PETTRIAGE_PROFILE: default
      # 컨테이너에서 DB를 부를 때만 쓰인다. 값은 .env 에서 온다.
      DATABASE_URL: mysql+pymysql://pettriage:${MYSQL_PASSWORD:-changeme}@db:3306/pettriage
    env_file:
      - path: .env
        required: false
    volumes:
      # 자료는 이미지에 굽지 않고 실행 시 마운트한다
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    # 계정·반려동물 프로필 (D-48). 벡터는 여기 안 들어온다 — Chroma 가 맡는다 (D-44).
    #
    # 팀원 PC 에 MySQL 을 깔지 않는다. 버전이 제각각이면 "내 PC에선 되는데" 가 시작된다.
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 호스트에서 직접 붙을 수 있게 연다 — API 를 컨테이너 밖에서 돌릴 때 쓴다.
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pettriage
      MYSQL_USER: pettriage
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme-root}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # mysqladmin ping 은 소켓만 확인한다. 실제 인증까지 봐야
      # API 가 "DB는 떴는데 로그인이 안 되는" 상태로 기동하지 않는다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u pettriage -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  trainer:
    profiles: ["train"]
    build:
      context: .
      dockerfile: docker/train.Dockerfile
    environment:
      PETTRIAGE_PROFILE: train
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - hf-cache:/cache/hf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mysqldata:
  hf-cache:
