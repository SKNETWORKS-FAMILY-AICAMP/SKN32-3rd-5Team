# 로컬 실행 구성.
#
#   docker compose up                      API + pgvector
#   docker compose --profile train run ...  학습 (GPU 필요)
#
# 🔴 data/ 는 마운트만 하고 이미지에 넣지 않는다 (D-29 · .dockerignore).

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PETTRIAGE_PROFILE: default
      # 컨테이너에서 DB를 부를 때만 쓰인다. 값은 .env 에서 온다.
      DATABASE_URL: postgresql://pettriage:${POSTGRES_PASSWORD:-changeme}@db:5432/pettriage
    env_file:
      - path: .env
        required: false
    volumes:
      # 자료는 이미지에 굽지 않고 실행 시 마운트한다
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    # 02 §11 — 메타데이터 필터를 SQL로 처리하고 정형 기준표를 같은 DB에서 관리
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pettriage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: pettriage
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pettriage"]
      interval: 5s
      timeout: 3s
      retries: 10

  trainer:
    profiles: ["train"]
    build:
      context: .
      dockerfile: docker/train.Dockerfile
    environment:
      PETTRIAGE_PROFILE: train
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - hf-cache:/cache/hf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
  hf-cache:
